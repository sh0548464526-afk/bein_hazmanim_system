
<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>התחברות</title>
<style>
body { font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#f5f5f5; }
form { background:white; padding:30px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.2); }
input { display:block; margin:10px 0; padding:10px; width:100%; }
button { padding:10px; width:100%; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>
<form method="POST">
<h2>התחברות למערכת</h2>
<input type="text" name="username" placeholder="שם משתמש" required>
<input type="password" name="password" placeholder="סיסמה" required>
<button type="submit">התחבר</button>
</form>
</body>
</html>
